# Without this, Compose names the project after the directory holding this
# file -- literally `docker` -- and the database volume becomes
# `docker_fleet-data`, which collides with any other project of yours laid
# out the same way. Pinning the name makes it `meshtastic-fleet-manager_fleet-data`.
#
# Changing this later points Compose at a *different* volume: the old data
# is not lost, but it is orphaned under the previous name. To carry it over:
#   docker run --rm -v docker_fleet-data:/from \
#     -v meshtastic-fleet-manager_fleet-data:/to busybox cp -a /from/. /to/
name: meshtastic-fleet-manager

services:
  fleet-manager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: meshtastic-fleet-manager
    restart: unless-stopped

    ports:
      # host:container. The container listens on whatever server.port says
      # in the mounted config (8432 by default); only the left number is
      # yours to choose.
      - "18432:8432"

    volumes:
      # The config is read once at startup; a change needs a restart.
      - ../config/config.yaml:/config/config.yaml:ro
      # The fleet database, at /data/fleet.db inside the container (set by
      # database.path in config.yaml).
      #
      # A named volume by default. It lives wherever the Docker engine keeps
      # volumes -- `docker volume inspect meshtastic-fleet-manager_fleet-data`
      # reports the path, but on Docker Desktop that path is inside the Linux
      # VM and is NOT browsable from the host. Reach it through a container:
      #
      #   docker run --rm -v meshtastic-fleet-manager_fleet-data:/data \
      #     busybox ls -la /data
      #
      # To keep the database in an ordinary host folder instead -- easier to
      # back up, inspect with a SQLite browser, or move between machines --
      # replace the line below with a bind mount:
      #
      #   - /srv/meshtastic/data:/data        # Linux / macOS / Raspberry Pi
      #   - ./data:/data                      # relative to THIS file (docker/)
      #   - C:\Users\you\meshtastic:/data     # Windows, Docker Desktop
      #
      # Mount the DIRECTORY, never `...:/data/fleet.db` directly: WAL mode
      # creates `fleet.db-wal` and `fleet.db-shm` beside the database, so the
      # directory itself has to be writable. A single-file bind mount fails
      # with "attempt to write a readonly database".
      #
      # Do NOT use /tmp. It is a tmpfs on most systems, so the fleet history
      # is wiped on every reboot; systemd-tmpfiles also prunes it while
      # running. Worse, if dockerd's unit sets PrivateTmp=true, the /tmp the
      # daemon sees is not the /tmp in your shell -- Docker then creates its
      # own empty root:root 0755 directory and any chmod you applied has no
      # effect at all. Use /var/lib/... or /srv/... instead.
      #
      # The container runs as uid 1000 (`node`), so a bind-mounted host
      # directory must be writable by that uid -- `sudo chown 1000:1000 <dir>`
      # on Linux. Docker Desktop on Windows and macOS handles this for you.
      # A bind mount keeps the host's ownership as-is; unlike a named volume
      # it is never re-owned to match the image, which is why one works out
      # of the box and the other needs a chown.
      #
      # Note that 0666 is NOT enough on a directory: without the execute bit
      # it cannot be entered, and SQLite fails with "unable to open database
      # file" exactly as if it had no permissions at all.
      #
      # On SELinux hosts (RHEL, Fedora, Rocky, Alma) add a :z suffix --
      # `- /srv/meshtastic/data:/data:z` -- or the container is denied
      # regardless of ownership and mode.
      # If you switch after collecting data, copy it across first with the
      # `docker run ... cp` recipe above.
      - fleet-data:/data

    devices:
      # Long syntax, not the usual "host:container" string, because by-id
      # paths routinely contain colons -- an ESP32-S3's is built from its
      # MAC, e.g. ..._xxxxxx-if00. The short form splits on ":"
      # and Compose rejects such a path outright with "confusing device
      # mapping, please use long syntax". The long form takes the path as
      # a value, so no escaping is needed and no quoting is required
      # (a colon only has meaning in YAML when followed by a space).
      #
      # Needs Compose v2.29+ / Docker Compose v5. On anything older, give
      # the device a colon-free alias with a udev rule and use the short
      # form against that -- see README.
      #
      # List your devices with:  ls -l /dev/serial/by-id/
      - source: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_F8:xxxxxx-if00
        # The container sees a clean, stable name. serial.port in
        # config.yaml must match THIS, not the source -- which keeps the
        # colons confined to this one line.
        target: /dev/meshtastic
        permissions: rw

    group_add:
      # The container runs as the unprivileged `node` user, which needs the
      # host's serial group to open the device. Find the numeric GID with:
      #   getent group dialout | cut -d: -f3
      # On most Debian/Ubuntu hosts this is 20; on Fedora/Arch the group is
      # `uucp`. A wrong value here shows up as EACCES on the serial port.
      - "20"

volumes:
  fleet-data:
