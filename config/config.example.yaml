# Meshtastic Fleet Manager configuration.
#
# Mount this file into the container at /config/config.yaml, or point the
# MFM_CONFIG environment variable at it when running outside Docker.
#
# Every value below is optional except auth: the server refuses to start
# on an invalid config rather than coming up half-configured.

server:
  host: 0.0.0.0

  # The port the SERVER listens on. Under Docker this is the container-side
  # port; docker/compose.yaml maps it to a host port (18432 by default), so
  # change that mapping, not this, to alter what you browse to.
  #
  # 8080 is deliberately avoided as the default: it is commonly claimed by
  # unrelated software (hardware-monitor agents, dev proxies, Docker), and a
  # clash there is confusing to diagnose -- the dev proxy happily forwards
  # to whatever else answers.
  #
  # Everything that needs this value reads it from here: the Vite dev proxy
  # and the container healthcheck included. Changing it is a one-line edit.
  port: 8432

  # Signs the session cookie. Generate with:
  #   openssl rand -hex 32
  # Omitting it works, but a new one is generated on every restart, which
  # logs everyone out when the process restarts.
  session_secret: "CHANGE-ME-32-bytes-of-random-hex"

  session_ttl: 12h

  # Marks the session cookie Secure. Set true ONLY when the UI is reached
  # over HTTPS -- browsers drop Secure cookies on a plain-HTTP origin, and
  # the symptom is a login form that appears to do nothing.
  secure_cookies: false

auth:
  # The built-in "admin" account. It lives here rather than in the database
  # so the console stays reachable when the database is empty, restored from
  # a backup, or has had its last admin account deleted. It cannot be renamed,
  # demoted or removed from inside the app, and no database user may take the
  # name "admin".
  #
  # Every other account is created from the Administration page, and gets one
  # of three roles:
  #
  #   admin    everything, including user accounts and clearing the node database
  #   manager  read everything, and use the radio (probe, remote configuration)
  #   viewer   read-only; never transmits
  #
  # Exactly one of password / password_hash.
  #
  # Plaintext is hashed at load time and never written to the database or
  # a log line, but it is still sitting in a file -- prefer password_hash
  # if anything else can read this file. Generate one with:
  #   node -e "import('./dist/server/config.js').then(m=>console.log(m.hashPassword('your-password')))"
  password: "change-me"
  # password_hash: "scrypt$<salt-hex>$<hash-hex>"

serial:
  # Path to the USB-attached local Meshtastic node, or "auto" to pick the
  # first device with a known Meshtastic USB vendor ID.
  #
  # This is the path as the PROCESS sees it:
  #
  #   Under Docker  -> the `target` from the devices mapping in
  #                    docker/compose.yaml, e.g. /dev/meshtastic.
  #   Bare metal    -> the real host path.
  #
  # Prefer a by-id path over /dev/ttyUSB0 or /dev/ttyACM0, which renumber
  # on replug; with two radios attached "the first one" is not stable.
  # List them with:  ls -l /dev/serial/by-id/
  #
  # by-id names often contain colons (an ESP32-S3 builds one from its MAC).
  # That needs no escaping here -- YAML only treats a colon specially when
  # it is followed by a space -- though quoting it does no harm:
  #
  #   port: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_F8:5B:1B:BE:C6:F0-if00
  #
  # Colons DO break the `devices:` short syntax in compose.yaml; that file
  # uses the long syntax instead.
  port: /dev/meshtastic
  baud: 115200

  # Seconds between reconnect attempts; the last value repeats forever.
  reconnect_backoff: [1s, 2s, 5s, 15s, 60s]

  # Set false to run the UI with no radio attached (useful for development).
  enabled: true

# Checks that the USB-attached radio is still working, not merely attached.
#
# An open serial port proves very little: firmware closes its end of the API
# session after 15 minutes without contact while the port stays open, and
# from here that looks exactly like a quiet mesh. So on a schedule the
# watchdog asks the local node for its own metadata -- over USB only, no
# airtime -- checks the answer against what it said on connect, and restarts
# the serial link when it stops answering correctly.
#
# (The 15-minute cutoff itself is prevented by a heartbeat the server always
# sends every 5 minutes, watchdog or not. The watchdog is for whatever else
# goes wrong.)
watchdog:
  enabled: true

  # Between self-checks while healthy. After a failure it re-checks every
  # 15s, so a dead link is restarted in about a minute either way.
  interval: 2m

  # How long one self-check may take. It never leaves the USB cable, so a
  # healthy radio answers in well under a second.
  timeout: 10s

  # Consecutive failed self-checks before the serial link is restarted.
  failures_before_restart: 3

  # Flag the radio as "nothing heard" when no other node has been heard over
  # the air for this long. Reported only, never acted on: a deaf receiver
  # and a quiet mesh look identical from here. Nodes send device telemetry
  # every 30 minutes by default, so 2h is several missed reports from every
  # node at once. Set 0 for a fleet of one, which is always silent.
  silence_after: 2h

database:
  # The DIRECTORY must be writable, not just the file: WAL mode creates
  # -wal and -shm siblings next to it.
  path: /data/fleet.db

# Which nodes are allowed into the fleet at all.
#
# The default admits anything the radio hears, which is what you want for a
# mesh you own. Narrow it when the radio also hears a busy public mesh you
# have no interest in tracking.
#
# The keys compose -- a node must satisfy all of them -- and they gate
# ADMISSION only. Once a node is in the fleet it is tracked normally, or a
# node admitted by one message would never record telemetry again.
#
# Nodes that do not match are ignored completely: no row, no last-heard
# time, no trace at all.
discovery:
  # "any", "primary" (channel 0), or a channel index 0-7 as configured on
  # the radio. The node must be heard on this channel to be admitted.
  #
  # Only a decoded packet proves the channel, because decoding it required
  # that channel's key. Entries from the radio's own node database do NOT:
  # their channel field is "only populated if it is not the default
  # channel", so a zero there means primary *or* unknown and is treated as
  # unknown. With a channel set, a node is admitted once it actually
  # transmits something the radio decodes on that channel.
  channel: any

  # Require an actual text message. Telemetry, position and node-info
  # broadcasts alone will not admit a node.
  #
  # This also filters the node database the radio hands over on connect,
  # which is deliberate: that dump contains everything the radio has ever
  # heard, and letting it through would admit the whole mesh on first run.
  require_message: false

  # Admit only when the message text contains this substring, compared
  # case-insensitively. Setting it implies require_message: true.
  #
  #   message_contains: "join fleet"
  message_contains: null

  # Ask a newly discovered node for its names, hardware, role and metrics
  # rather than waiting hours for its next broadcast.
  #
  # Discovery can admit a node on evidence carrying nothing but its number
  # -- a text message says who sent it and no more -- which would otherwise
  # leave a row showing only a node ID for the rest of the day.
  #
  # Costs up to two transmissions per newly discovered node, and only for
  # what is actually missing, so turn it off on a busy mesh where airtime
  # matters more than filling rows in promptly. The Refresh button on a
  # node's page is unaffected either way.
  probe_new_nodes: true

  # Admit nodes the radio only ever witnessed over MQTT rather than hearing
  # on the air.
  #
  # Off by default: an MQTT-sourced node never transmitted on your channel,
  # so it cannot satisfy "what the radio hears" -- yet the radio still lists
  # it in the node database it hands over, which is the usual reason
  # strangers appear in a fleet that should be private.
  include_mqtt: false

fleet:
  # A node heard within this window is "online".
  stale_after: 6h
  # Past this it is "offline" rather than merely stale.
  offline_after: 24h

  # How often to re-establish whether the local node may administer each
  # remote node. Each probe is a real LoRa round trip, so keep it slow.
  admin_probe_interval: 24h
  admin_probe_timeout: 30s

  # Telemetry and position history older than this is pruned. Unbounded
  # growth on a Raspberry Pi's SD card is a real failure mode.
  telemetry_retention: 30d

logging:
  level: info
