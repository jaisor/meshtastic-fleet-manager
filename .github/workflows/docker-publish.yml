name: Build and publish Docker image

# Every push to main publishes a dev build to Docker Hub as
# jaisor/meshtastic-fleet-manager:dev, plus an immutable dev-<short sha> tag
# to pin or roll back to. `latest` is left for tagged releases.

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jaisor/meshtastic-fleet-manager
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The context is the repo root and the Dockerfile lives in docker/,
      # matching docker/compose.yaml.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
